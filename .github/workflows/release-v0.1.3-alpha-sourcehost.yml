name: release-v0.1.3-alpha-sourcehost

on:
  push:
    branches:
      - main
    paths:
      - 'RELEASE-v0.1.3-alpha-v3'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: 0.1.3-alpha
      DETOURS_COMMIT: e4bfd6b03e50de46b47abfbd1e46b384f0c5f833
      RESHADE_COMMIT: 18deaa52de0c425a78b329e9cb3c497281cd00ec
      VULKAN_HEADERS_COMMIT: ee2ec5fd83dafce291024683b50dc89219333076
      RESHADE_SHADERS_COMMIT: 6db142b4b1a05c764222e5b0bd9a644b7ccfe1dc
      HOST_SOURCE_COMMIT: 03da7d9ca36c92f462ed936f5a629116b6b8ee5b
      NVIDIA_DLSS_SDK_COMMIT: 374959484e79a640feaba44c93ac8cfb0a03f5b5
      RENODX_ARCHIVE_URL: https://github.com/RankFTW/rhi-repo/releases/download/renodx-dlss5-4.60/renodx-dlss5_4.60.zip
      RENODX_ARCHIVE_SHA256: ad30994ba898f3eed5a4c7953927db9759c680a71bc9d9855cac93e9ccc1e3c6
    steps:
      - name: Checkout Star Lifter
        uses: actions/checkout@v4

      - name: Resolve Visual Studio
        id: vs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio C++ tools not found.' }
          "path=$($vs.Trim())" >> $env:GITHUB_OUTPUT

      - name: Fetch pinned Vulkan headers
        shell: pwsh
        run: |
          $vkh = "$env:RUNNER_TEMP\vkh"
          git clone https://github.com/KhronosGroup/Vulkan-Headers.git $vkh
          git -C $vkh checkout $env:VULKAN_HEADERS_COMMIT
          New-Item -ItemType Directory -Force external\vulkan\vulkan,external\vulkan\vk_video | Out-Null
          Copy-Item "$vkh\include\vulkan\*.h" external\vulkan\vulkan\ -Force
          Copy-Item "$vkh\include\vk_video\*.h" external\vulkan\vk_video\ -Force
          if (!(Test-Path external\vulkan\vulkan\vulkan_core.h)) { throw 'Vulkan headers were not installed.' }

      - name: Patch and build Star Lifter game-side feeder
        shell: pwsh
        run: |
          & .\tools\Apply-StarLifter-F5Toggle.ps1 -SourcePath .\src\dlss5-feed32.cpp
          & cmd.exe /d /c 'build-hostclient64.bat'
          if ($LASTEXITCODE -ne 0) { throw "build-hostclient64.bat failed: $LASTEXITCODE" }
          $feed = '.\build\dlss5-feed-hostclient.addon64'
          if (!(Test-Path $feed)) { throw 'Patched feeder build output missing.' }
          $ascii = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes((Resolve-Path $feed)))
          if ($ascii -notmatch 'STAR LIFTER F5: Enable DLSS Neural Rendering') { throw 'Built feeder does not contain the F5 patch.' }
          "FEED_HASH=$((Get-FileHash $feed -Algorithm SHA256).Hash)" >> $env:GITHUB_ENV

      - name: Build helper host from pinned September 2 source lineage
        shell: pwsh
        run: |
          $upstream = "$env:RUNNER_TEMP\feeder-source"
          git clone https://github.com/jlrouzies-fr/DLSS5-Feeder.git $upstream
          git -C $upstream checkout $env:HOST_SOURCE_COMMIT
          $actual = (git -C $upstream rev-parse HEAD).Trim()
          if ($actual -ne $env:HOST_SOURCE_COMMIT) { throw "Wrong feeder source commit: $actual" }

          $sdk = "$env:RUNNER_TEMP\nvidia-dlss-sdk"
          git clone https://github.com/NVIDIA/DLSS.git $sdk
          git -C $sdk checkout $env:NVIDIA_DLSS_SDK_COMMIT
          $sdkActual = (git -C $sdk rev-parse HEAD).Trim()
          if ($sdkActual -ne $env:NVIDIA_DLSS_SDK_COMMIT) { throw "Wrong NVIDIA DLSS SDK commit: $sdkActual" }

          $ngx = Join-Path $upstream 'external\ngx'
          New-Item -ItemType Directory -Force $ngx,(Join-Path $ngx 'libs') | Out-Null
          Copy-Item -Path (Join-Path $sdk 'include\*') -Destination $ngx -Recurse -Force
          $sdkLib = Join-Path $sdk 'lib\Windows_x86_64\x64\nvsdk_ngx_d.lib'
          if (!(Test-Path $sdkLib)) { throw 'NVIDIA NGX import library missing from pinned SDK.' }
          Copy-Item -LiteralPath $sdkLib -Destination (Join-Path $ngx 'libs\nvsdk_ngx_d.lib') -Force

          & cmd.exe /d /c "`"$upstream\host\build-host.bat`""
          if ($LASTEXITCODE -ne 0) { throw "Pinned helper host build failed: $LASTEXITCODE" }
          $hostExe = Join-Path $upstream 'host\dlss5-feed-host64.exe'
          $feedFx = Join-Path $upstream 'shaders\DLSS5_Feed.fx'
          if (!(Test-Path $hostExe) -or !(Test-Path $feedFx)) { throw 'Pinned host build outputs are incomplete.' }
          if ((Get-Item $hostExe).Length -lt 65536) { throw 'Built host is suspiciously small.' }
          "GOOD_HOST=$hostExe" >> $env:GITHUB_ENV
          "DLSS_FX=$feedFx" >> $env:GITHUB_ENV
          "HOST_HASH=$((Get-FileHash $hostExe -Algorithm SHA256).Hash)" >> $env:GITHUB_ENV

      - name: Validate installer-pinned RenoDX dependency now
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\renodx460.zip"
          $dir = "$env:RUNNER_TEMP\renodx460"
          Invoke-WebRequest -UseBasicParsing -Uri $env:RENODX_ARCHIVE_URL -OutFile $zip
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($zipHash -ne $env:RENODX_ARCHIVE_SHA256) { throw "RenoDX archive hash mismatch: $zipHash" }
          Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
          $addon = Get-ChildItem -LiteralPath $dir -Recurse -File -Filter 'renodx-dlss5.addon64' | Select-Object -First 1
          if (!$addon) { throw 'RenoDX archive is missing renodx-dlss5.addon64.' }
          $addonHash = (Get-FileHash $addon.FullName -Algorithm SHA256).Hash
          "RENODX_RESOLVED_ADDON_SHA256=$addonHash" >> $env:GITHUB_ENV
          Write-Host "[PASS] Pinned RenoDX archive verified. Extracted add-on SHA256: $addonHash"- name: Build Microsoft Detours 4.0.1
        shell: pwsh
        run: |
          $detours = "$env:RUNNER_TEMP\detours"
          git clone --branch v4.0.1 --single-branch --depth 1 https://github.com/microsoft/Detours.git $detours
          $head = (git -C $detours rev-parse HEAD).Trim()
          if ($head -ne $env:DETOURS_COMMIT) { throw "Unexpected Detours commit: $head" }
          $cmd = @(
            '@echo off',
            'call "${{ steps.vs.outputs.path }}\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64',
            'if errorlevel 1 exit /b %errorlevel%',
            "cd /d `"$detours\src`"",
            'nmake',
            'exit /b %errorlevel%'
          )
          $cmd | Set-Content "$env:RUNNER_TEMP\build-detours.cmd" -Encoding Ascii
          & cmd.exe /d /c "`"$env:RUNNER_TEMP\build-detours.cmd`""
          if ($LASTEXITCODE -ne 0) { throw "Detours build failed: $LASTEXITCODE" }

      - name: Build locked V7 bridge and launcher
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\sunrise-v7"
          New-Item -ItemType Directory -Force $out | Out-Null
          $cmd = @(
            '@echo off',
            'call "${{ steps.vs.outputs.path }}\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64',
            'if errorlevel 1 exit /b %errorlevel%',
            "cl /nologo /LD /O2 /MT /std:c++17 /EHsc `"$env:GITHUB_WORKSPACE\sunrise\v7\SunriseNRB-ProvenWorkerV7.cpp`" kernel32.lib /link /DEF:`"$env:GITHUB_WORKSPACE\sunrise\v7\SunriseNRB-ProvenWorkerV7.def`" /OUT:`"$out\SunriseNRB.dll`"",
            'if errorlevel 1 exit /b %errorlevel%',
            "dumpbin /nologo /exports `"$out\SunriseNRB.dll`" | findstr /R /C:`"[ ]1[ ]`"",
            'if errorlevel 1 exit /b 93',
            "cl /nologo /O2 /MT /std:c++17 /EHsc /I`"$env:RUNNER_TEMP\detours\include`" `"$env:GITHUB_WORKSPACE\sunrise\v7\SunriseNRB-Launcher-V7.cpp`" `"$env:RUNNER_TEMP\detours\lib.X64\detours.lib`" /link /SUBSYSTEM:CONSOLE /OUT:`"$out\SunriseNRB-Launcher.exe`"",
            'exit /b %errorlevel%'
          )
          $cmd | Set-Content "$env:RUNNER_TEMP\build-v7.cmd" -Encoding Ascii
          & cmd.exe /d /c "`"$env:RUNNER_TEMP\build-v7.cmd`""
          if ($LASTEXITCODE -ne 0) { throw "V7 build failed: $LASTEXITCODE" }

      - name: Build patched ReShade 6.8.0 and ReShadeFXC
        shell: pwsh
        run: |
          $rr = "$env:RUNNER_TEMP\reshade"
          git clone --branch v6.8.0 --depth 1 --recurse-submodules --shallow-submodules https://github.com/crosire/reshade.git $rr
          $head = (git -C $rr rev-parse HEAD).Trim()
          if ($head -ne $env:RESHADE_COMMIT) { throw "Unexpected ReShade commit: $head" }
          & .\sunrise\v7\Apply-ReShade-ProbeCompat.ps1 -ReShadeRoot $rr
          $cmd = @(
            '@echo off',
            'call "${{ steps.vs.outputs.path }}\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64',
            'if errorlevel 1 exit /b %errorlevel%',
            "set `"SolutionDir=$rr\`"",
            "msbuild `"$rr\ReShade.vcxproj`" /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 /verbosity:minimal /nologo",
            'if errorlevel 1 exit /b %errorlevel%',
            "msbuild `"$rr\ReShadeFXC.vcxproj`" /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 /verbosity:minimal /nologo",
            'exit /b %errorlevel%'
          )
          $cmd | Set-Content "$env:RUNNER_TEMP\build-reshade.cmd" -Encoding Ascii
          & cmd.exe /d /c "`"$env:RUNNER_TEMP\build-reshade.cmd`""
          if ($LASTEXITCODE -ne 0) { throw "ReShade build failed: $LASTEXITCODE" }
          $dll = "$rr\bin\x64\Release\ReShade64.dll"
          if (!(Test-Path $dll)) { throw 'Patched ReShade64.dll missing.' }
          $fxc = Get-ChildItem -LiteralPath $rr -Recurse -File -Filter 'ReShadeFXC.exe' | Select-Object -First 1
          if (!$fxc) { throw 'ReShadeFXC.exe missing.' }
          "PATCHED_RESHADE=$dll" >> $env:GITHUB_ENV
          "RESHADFXC=$($fxc.FullName)" >> $env:GITHUB_ENV

      - name: Fetch pinned ReShade shader headers
        shell: pwsh
        run: |
          $rs = "$env:RUNNER_TEMP\reshade-shaders"
          git clone https://github.com/crosire/reshade-shaders.git $rs
          git -C $rs checkout $env:RESHADE_SHADERS_COMMIT
          foreach ($f in @('ReShade.fxh','ReShadeUI.fxh','DrawText.fxh')) {
            if (!(Test-Path "$rs\Shaders\$f")) { throw "Pinned ReShade header missing: $f" }
          }
          "RESHADERS=$rs" >> $env:GITHUB_ENV

      - name: Compile Star Lifter shaders
        shell: pwsh
        run: |
          $check = "$env:RUNNER_TEMP\shader-check"
          New-Item -ItemType Directory -Force $check | Out-Null
          Copy-Item -LiteralPath '.\reshade-shaders\Shaders\KageBlink - SideBySide.fx' -Destination $check
          Copy-Item -LiteralPath '.\reshade-shaders\Shaders\KageBlink - HDR LOG Sliders.fx' -Destination $check
          Copy-Item -LiteralPath "$env:RESHADERS\Shaders\ReShade.fxh" -Destination $check
          & $env:RESHADFXC -I $check --width 3440 --height 1440 -Fo "$env:RUNNER_TEMP\sbs.hlsl" "$check\KageBlink - SideBySide.fx"
          if ($LASTEXITCODE -ne 0) { throw 'SideBySide shader compilation failed.' }
          & $env:RESHADFXC -I $check --width 3440 --height 1440 -Fo "$env:RUNNER_TEMP\hdr.hlsl" "$check\KageBlink - HDR LOG Sliders.fx"
          if ($LASTEXITCODE -ne 0) { throw 'HDR shader compilation failed.' }

      - name: Assemble package from a completely empty stage
        shell: pwsh
        run: |
          $pkg = "$env:RUNNER_TEMP\package"
          $payload = Join-Path $pkg 'payload'
          if (Test-Path $pkg) { Remove-Item $pkg -Recurse -Force }
          New-Item -ItemType Directory -Force $payload | Out-Null

          function Put([string]$Source,[string]$Relative) {
            $dest = Join-Path $payload $Relative
            New-Item -ItemType Directory -Force (Split-Path -Parent $dest) | Out-Null
            Copy-Item -LiteralPath $Source -Destination $dest -Force
          }

          Put $env:PATCHED_RESHADE 'ReShade64.dll'
          Put '.\build\dlss5-feed-hostclient.addon64' 'dlss5-feed.addon64'
          Put '.\runtime\dlss5-feed.cfg' 'dlss5-feed.cfg'
          Put '.\sunrise\v7\SUNRISE-NRB.bat' 'SUNRISE-NRB.bat'
          Put '.\CONFIGURE-STAR-LIFTER.ps1' 'CONFIGURE-STAR-LIFTER.ps1'
          Put '.\CONFIGURE-STAR-LIFTER.bat' 'CONFIGURE-STAR-LIFTER.bat'
          Put "$env:RUNNER_TEMP\sunrise-v7\SunriseNRB.dll" 'SunriseNRB\SunriseNRB.dll'
          Put "$env:RUNNER_TEMP\sunrise-v7\SunriseNRB-Launcher.exe" 'SunriseNRB\SunriseNRB-Launcher.exe'
          Put $env:GOOD_HOST 'host64\dlss5-feed-host64.exe'
          Put $env:PATCHED_RESHADE 'host64\dxgi.dll'
          Put '.\runtime\host64-ReShade.ini' 'host64\ReShade.ini'
          Put $env:DLSS_FX 'reshade-shaders\Shaders\DLSS5_Feed.fx'
          Put '.\reshade-shaders\Shaders\KageBlink - SideBySide.fx' 'reshade-shaders\Shaders\KageBlink - SideBySide.fx'
          Put '.\reshade-shaders\Shaders\KageBlink - HDR LOG Sliders.fx' 'reshade-shaders\Shaders\KageBlink - HDR LOG Sliders.fx'
          foreach ($f in @('ReShade.fxh','ReShadeUI.fxh','DrawText.fxh')) { Put "$env:RESHADERS\Shaders\$f" "reshade-shaders\Shaders\$f" }

          $files = @()
          foreach ($f in Get-ChildItem -LiteralPath $payload -Recurse -File | Sort-Object FullName) {
            $rel = $f.FullName.Substring($payload.Length + 1)
            $files += [pscustomobject]@{ source=$rel; destination=$rel; sha256=(Get-FileHash $f.FullName -Algorithm SHA256).Hash }
          }
          [pscustomobject]@{ formatVersion=3; version=$env:VERSION; generatedAt=(Get-Date).ToString('o'); hostSourceCommit=$env:HOST_SOURCE_COMMIT; nvidiaSdkCommit=$env:NVIDIA_DLSS_SDK_COMMIT; files=$files } |
            ConvertTo-Json -Depth 8 | Set-Content (Join-Path $payload 'payload-manifest.json') -Encoding UTF8

          foreach ($f in @('Install-Sunrise.bat','Install-Sunrise.ps1','README.md','THIRD-PARTY-NOTICES.md','LICENSE','RELEASE-NOTES-v0.1.3-alpha.md')) {
            Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE $f) -Destination (Join-Path $pkg $f) -Force
          }
          @(
            "STAR LIFTER v$env:VERSION",
            "game-side feeder SHA256: $env:FEED_HASH",
            "helper host source: jlrouzies-fr/DLSS5-Feeder@$env:HOST_SOURCE_COMMIT",
            "helper host build SHA256: $env:HOST_HASH",
            "NVIDIA DLSS SDK headers/import library: NVIDIA/DLSS@$env:NVIDIA_DLSS_SDK_COMMIT",
            "ReShade source: crosire/reshade@$env:RESHADE_COMMIT",
            "RenoDX archive SHA256: $env:RENODX_ARCHIVE_SHA256",
            "RenoDX resolved add-on SHA256: $env:RENODX_RESOLVED_ADDON_SHA256"
          ) | Set-Content (Join-Path $pkg 'STAR-LIFTER-BUILD-PROVENANCE.txt') -Encoding UTF8
          $nvidiaDir = Join-Path $pkg 'USER-RUNTIME\NVIDIA'
          New-Item -ItemType Directory -Force $nvidiaDir | Out-Null
          @(
            'STAR LIFTER does not distribute NVIDIA proprietary runtime binaries.',
            'Put legitimate copies of these files here BEFORE running Install-Sunrise.bat:',
            '',
            '  nvngx_dlss.dll',
            '  nvngx_dlssnr.dll'
          ) | Set-Content (Join-Path $nvidiaDir 'PUT-NVIDIA-DLLS-HERE.txt') -Encoding UTF8
          "PACKAGE_ROOT=$pkg" >> $env:GITHUB_ENV

      - name: Reject forbidden and stale content
        shell: pwsh
        run: |
          foreach ($bad in @('steam_api64.dll','destiny2.exe','nvngx_dlss.dll','nvngx_dlssnr.dll','dlss5-feed-host64-f5safe.exe')) {
            if (Get-ChildItem -LiteralPath $env:PACKAGE_ROOT -Recurse -File -Filter $bad -ErrorAction SilentlyContinue) { throw "Forbidden file in package: $bad" }
          }
          $junk = Get-ChildItem -LiteralPath $env:PACKAGE_ROOT -Recurse -File | Where-Object { $_.Name -match '(?i)(\.bak$|\.log$|BEFORE-|EXPERIMENTAL|F5-WORKING)' }
          if ($junk) { throw "Stale test files entered package: $($junk.FullName -join ', ')" }

      - name: Create ZIP
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'STAR-LIFTER-v0.1.3-alpha.zip'
          if (Test-Path $out) { Remove-Item $out -Force }
          Compress-Archive -Path (Join-Path $env:PACKAGE_ROOT '*') -DestinationPath $out -CompressionLevel Optimal
          $hash = (Get-FileHash $out -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  STAR-LIFTER-v0.1.3-alpha.zip" | Set-Content "$out.sha256" -Encoding Ascii

      - name: Validate the actual final ZIP from a second clean extraction
        shell: pwsh
        run: |
          $zip = Join-Path $env:GITHUB_WORKSPACE 'STAR-LIFTER-v0.1.3-alpha.zip'
          $verify = "$env:RUNNER_TEMP\FINAL-ZIP-VERIFY"
          if (Test-Path $verify) { Remove-Item $verify -Recurse -Force }
          New-Item -ItemType Directory -Force $verify | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $verify -Force
          $required = @(
            'Install-Sunrise.bat','Install-Sunrise.ps1','README.md','STAR-LIFTER-BUILD-PROVENANCE.txt',
            'USER-RUNTIME\NVIDIA\PUT-NVIDIA-DLLS-HERE.txt','payload\payload-manifest.json',
            'payload\ReShade64.dll','payload\dlss5-feed.addon64','payload\dlss5-feed.cfg','payload\SUNRISE-NRB.bat',
            'payload\CONFIGURE-STAR-LIFTER.ps1','payload\CONFIGURE-STAR-LIFTER.bat',
            'payload\SunriseNRB\SunriseNRB.dll','payload\SunriseNRB\SunriseNRB-Launcher.exe',
            'payload\host64\dlss5-feed-host64.exe','payload\host64\dxgi.dll','payload\host64\ReShade.ini',
            'payload\reshade-shaders\Shaders\DLSS5_Feed.fx','payload\reshade-shaders\Shaders\KageBlink - HDR LOG Sliders.fx',
            'payload\reshade-shaders\Shaders\KageBlink - SideBySide.fx','payload\reshade-shaders\Shaders\ReShade.fxh'
          )
          foreach ($rel in $required) { if (!(Test-Path -LiteralPath (Join-Path $verify $rel) -PathType Leaf)) { throw "FINAL ZIP missing: $rel" } }
          foreach ($bad in @('steam_api64.dll','destiny2.exe','nvngx_dlss.dll','nvngx_dlssnr.dll','dlss5-feed-host64-f5safe.exe')) {
            if (Get-ChildItem -LiteralPath $verify -Recurse -File -Filter $bad -ErrorAction SilentlyContinue) { throw "FINAL ZIP contains forbidden file: $bad" }
          }
          $manifest = Get-Content (Join-Path $verify 'payload\payload-manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.hostSourceCommit -ne $env:HOST_SOURCE_COMMIT) { throw 'Final manifest lost host-source provenance.' }
          foreach ($entry in $manifest.files) {
            $p = Join-Path (Join-Path $verify 'payload') $entry.source
            if (!(Test-Path -LiteralPath $p)) { throw "Manifest points at missing file: $($entry.source)" }
            if ((Get-FileHash $p -Algorithm SHA256).Hash -ne $entry.sha256) { throw "Payload hash mismatch: $($entry.source)" }
          }
          $feedAscii = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes((Join-Path $verify 'payload\dlss5-feed.addon64')))
          if ($feedAscii -notmatch 'STAR LIFTER F5: Enable DLSS Neural Rendering') { throw 'FINAL ZIP feeder lost the F5 patch.' }
          Write-Host '[PASS] Finished ZIP validated from a second clean extraction.' -ForegroundColor Green

      - name: Publish v0.1.3-alpha only after final ZIP validation
        shell: pwsh
        run: |
          gh release view v0.1.3-alpha *> $null
          if ($LASTEXITCODE -eq 0) { gh release delete v0.1.3-alpha --yes --cleanup-tag }
          gh release create v0.1.3-alpha `
            'STAR-LIFTER-v0.1.3-alpha.zip' `
            'STAR-LIFTER-v0.1.3-alpha.zip.sha256' `
            --target '${{ github.sha }}' `
            --title 'STAR LIFTER v0.1.3-alpha' `
            --notes-file 'RELEASE-NOTES-v0.1.3-alpha.md' `
            --prerelease
