name: release-v0.1.2-alpha (retired)

# RETIRED: this workflow inherited the v0.1.1 release ZIP and merged newer files
# into it. That made stale/nested artifacts part of the next release and meant the
# shipped ZIP was not reproducible from the repository. Keep this file only as a
# historical marker; v0.1.3-alpha and later use clean-room packaging from an empty
# staging directory and validate the final ZIP after extraction.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: windows-2022
    steps:
      - shell: pwsh
        run: |
          Write-Host 'release-v0.1.2-alpha is retired. Use the clean-room v0.1.3-alpha workflow.'
