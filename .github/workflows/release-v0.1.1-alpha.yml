name: release-v0.1.1-alpha (retired)

# RETIRED: this historical workflow inherited an older release ZIP. It is kept only
# as a marker and must never publish again. v0.1.3-alpha and later use clean-room
# packaging and validate the finished ZIP after extraction.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: windows-2022
    steps:
      - shell: pwsh
        run: |
          Write-Host 'release-v0.1.1-alpha is retired. Use the clean-room v0.1.3-alpha workflow.'
